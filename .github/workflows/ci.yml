name: Build and test

on:
  push:
    branches: [main, 'ci/**', 'perf/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Qt build, tests and static checks
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build gettext shellcheck \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-dialogs \
            qml6-module-qtquick-effects qml6-module-qtquick-window \
            qml6-module-qtqml qml6-module-qtqml-models \
            qml6-module-qtqml-workerscript \
            dbus-daemon libglib2.0-bin ffmpeg poppler-utils

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DALVEUS_BUILD_TESTS=ON

      - name: Build all targets
        run: cmake --build build --parallel "$(nproc)"

      - name: Run core tests
        run: dbus-run-session -- ctest --test-dir build --output-on-failure

      - name: Validate translation catalogs
        run: |
          for catalog in po/*.po; do
            msgfmt --check --check-format -o /dev/null "$catalog"
          done
          msgcmp po/en.po po/uk.po
          msgcmp po/ru.po po/uk.po
          for catalog in po/en.po po/ru.po; do
            if msgattrib --untranslated --no-obsolete "$catalog" | grep -q '^msgid "'; then
              echo "::error::Untranslated entries found in $catalog"
              exit 1
            fi
          done
          python3 tests/check_translations.py

      - name: Check RPM build script command-line options
        run: |
          ./packaging/build-rpm.sh --help
          set +e
          ./packaging/build-rpm.sh --unknown-option
          status=$?
          set -e
          if [[ "$status" -ne 2 ]]; then
            echo "Expected unknown options to exit with status 2, got $status" >&2
            exit 1
          fi

      - name: Check shell scripts
        shell: bash
        run: |
          mapfile -d '' scripts < <(
            find . -type f -name '*.sh' \
              -not -path './.git/*' \
              -not -path './build/*' -print0
          )
          if (("${#scripts[@]}" > 0)); then
            for script in "${scripts[@]}"; do
              bash -n "$script"
            done
            shellcheck --severity=error "${scripts[@]}"
          fi

      - name: Lint QML scene and effects
        shell: bash
        env:
          QML_IMPORT_PATH: ${{ github.workspace }}/build/qml:${{ github.workspace }}/build/mocks:${{ github.workspace }}/tests/mocks
        run: |
          qmllint_bin="$(command -v qmllint || true)"
          if [[ -z "$qmllint_bin" && -x /usr/lib/qt6/bin/qmllint ]]; then
            qmllint_bin=/usr/lib/qt6/bin/qmllint
          fi
          if [[ -z "$qmllint_bin" ]]; then
            echo "qmllint was not installed" >&2
            exit 1
          fi
          "$qmllint_bin" \
            -I "$GITHUB_WORKSPACE/build/qml" \
            -I "$GITHUB_WORKSPACE/build/mocks" \
            -I "$GITHUB_WORKSPACE/tests/mocks" \
            package/contents/ui/Backdrop.qml \
            package/contents/ui/AlveusSettings.qml \
            tests/scene.qml

      - name: Require development log for implementation changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          changed_files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          if grep -Eq '^(core/|package/|tests/|packaging/|data/|po/|cmake/|CMakeLists\.txt$|install\.sh$|uninstall\.sh$|recover\.sh$|\.github/workflows/)' <<< "${changed_files}"; then
            if ! grep -Fxq 'docs/DEVELOPMENT_LOG.md' <<< "${changed_files}"; then
              echo "::error::Implementation, test, CI, or packaging changes require a dated entry in docs/DEVELOPMENT_LOG.md."
              exit 1
            fi
          fi

      - name: Render UI previews
        env:
          QML_IMPORT_PATH: ${{ github.workspace }}/build/qml:${{ github.workspace }}/build/mocks:${{ github.workspace }}/tests/mocks
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Fusion
          HOME: ${{ runner.temp }}/alveus-preview-home
          XDG_DATA_HOME: ${{ runner.temp }}/alveus-preview-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/alveus-preview-config
        run: |
          mkdir -p docs/assets "$HOME/Desktop" "$HOME/Downloads" "$XDG_DATA_HOME" "$XDG_CONFIG_HOME"
          printf 'XDG_DESKTOP_DIR="%s/Desktop"\nXDG_DOWNLOAD_DIR="%s/Downloads"\n' "$HOME" "$HOME" > "$XDG_CONFIG_HOME/user-dirs.dirs"
          mkdir -p "$HOME/Desktop/Project folder"
          printf 'Alveus release notes and project details.\n' > "$HOME/Desktop/Quarterly report.pdf"
          printf 'Remember to review the next Alveus build.\n' > "$HOME/Desktop/Meeting notes.txt"
          printf 'Project folder for the desktop layout.\n' > "$HOME/Desktop/Project folder/README.txt"
          touch "$HOME/Desktop/Holiday photo.jpg" "$HOME/Desktop/Alveus screenshot.png" "$HOME/Desktop/Project archive.zip" "$HOME/Desktop/Release demo.mp4"
          printf 'A sample download for the Alveus preview.\n' > "$HOME/Downloads/Alveus beta notes.txt"
          touch "$HOME/Downloads/Camera sample.jpg"
          build/tests/uiharness tests/scene.qml docs/assets/alveus-desktop-preview.png 1200 1600 900 rich "$HOME/Downloads"

      - name: Upload desktop preview
        uses: actions/upload-artifact@v4
        with:
          name: alveus-desktop-preview
          path: docs/assets/alveus-desktop-preview.png
          if-no-files-found: error

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
