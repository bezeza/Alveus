name: Build and test

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ gettext dbus-daemon ffmpeg \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-tools-dev-tools
      - name: Configure
        run: cmake -S . -B build -G Ninja -DALVEUS_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: dbus-run-session -- ctest --test-dir build --output-on-failure

  windows:
    name: Windows shared-core build and platform tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
      - name: Configure
        run: cmake -S . -B build -G Ninja -DALVEUS_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
