name: Build and test

on:
  push:
    branches: [main, 'ci/**', 'perf/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Qt build, tests and static checks
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build gettext shellcheck \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-dialogs \
            qml6-module-qtquick-effects qml6-module-qtquick-window \
            qml6-module-qtqml qml6-module-qtqml-models \
            qml6-module-qtqml-workerscript \
            dbus-daemon libglib2.0-bin ffmpeg poppler-utils

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DALVEUS_BUILD_TESTS=ON

      - name: Build all targets
        run: cmake --build build --parallel "$(nproc)"

      - name: Run core tests
        run: dbus-run-session -- ctest --test-dir build --output-on-failure

      - name: Check shell scripts
        shell: bash
        run: |
          mapfile -d '' scripts < <(
            find . -type f -name '*.sh' \
              -not -path './.git/*' \
              -not -path './build/*' -print0
          )
          if (("${#scripts[@]}" > 0)); then
            for script in "${scripts[@]}"; do
              bash -n "$script"
            done
            shellcheck --severity=error "${scripts[@]}"
          fi

      - name: Lint QML scene and effects
        shell: bash
        env:
          QML_IMPORT_PATH: ${{ github.workspace }}/build/qml:${{ github.workspace }}/build/mocks:${{ github.workspace }}/tests/mocks
        run: |
          qmllint_bin="$(command -v qmllint || true)"
          if [[ -z "$qmllint_bin" && -x /usr/lib/qt6/bin/qmllint ]]; then
            qmllint_bin=/usr/lib/qt6/bin/qmllint
          fi
          if [[ -z "$qmllint_bin" ]]; then
            echo "qmllint was not installed" >&2
            exit 1
          fi
          "$qmllint_bin" \
            -I "$GITHUB_WORKSPACE/build/qml" \
            -I "$GITHUB_WORKSPACE/build/mocks" \
            -I "$GITHUB_WORKSPACE/tests/mocks" \
            package/contents/ui/Backdrop.qml \
            package/contents/ui/AlveusSettings.qml \
            tests/scene.qml

      - name: Require development log for implementation changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          changed_files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          if grep -Eq '^(core/|package/|tests/|packaging/|data/|po/|cmake/|CMakeLists\.txt$|install\.sh$|uninstall\.sh$|recover\.sh$|\.github/workflows/)' <<< "${changed_files}"; then
            if ! grep -Fxq 'docs/DEVELOPMENT_LOG.md' <<< "${changed_files}"; then
              echo "::error::Implementation, test, CI, or packaging changes require a dated entry in docs/DEVELOPMENT_LOG.md."
              exit 1
            fi
          fi

      - name: Validate translation catalogs
        run: |
          python3 tests/check_translations.py
          for catalog in po/*.po; do
            msgfmt --check -o /dev/null "$catalog"
          done

      - name: Render Alveus UI previews
        env:
          QML_IMPORT_PATH: ${{ github.workspace }}/build/qml:${{ github.workspace }}/build/mocks:${{ github.workspace }}/tests/mocks
          QT_QPA_PLATFORM: offscreen
          ALVEUS_UIHARNESS_STRICT: "1"
        run: |
          mkdir -p "$HOME/Desktop" docs/screenshots
          printf 'Alveus demo document\n' > "$HOME/Desktop/Project-notes.txt"
          printf 'Alveus demo archive\n' > "$HOME/Desktop/Photos.zip"
          printf 'Alveus demo report\n' > "$HOME/Desktop/Report.pdf"
          ./build/tests/uiharness tests/scene.qml docs/screenshots/alveus-desktop.png 1200 1600 900 rich /tmp
          ./build/tests/uiharness tests/scene.qml docs/screenshots/alveus-settings.png 1200 1600 900 alveus

      - name: Upload Alveus UI previews
        uses: actions/upload-artifact@v4
        with:
          name: alveus-ui-previews
          path: docs/screenshots/*.png
          if-no-files-found: error

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
